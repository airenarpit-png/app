<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // GitHub Pages SPA redirect
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/app/?p=' + l.pathname.slice(1) + l.search + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
